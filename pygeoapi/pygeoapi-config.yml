server:
    bind:
        host: 0.0.0.0
        port: 80
    url: http://localhost:5000
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    languages:
        - en-US
    pretty_print: true
    limits:
        default_items: 20
        max_items: 500
    map:
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'

logging:
    level: INFO

metadata:
    identification:
        title: ili2ogc pygeoapi demo
        description: Real Swiss geodata served via OGC API Features and Maps.
        keywords:
            - interlis
            - ogc
            - switzerland
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: https://github.com/maxcollombin/ili2ogc
    license:
        name: MIT
        url: https://github.com/maxcollombin/ili2ogc/blob/main/LICENSE
    provider:
        name: Maxime Collombin
        url: https://github.com/maxcollombin/ili2ogc
    contact:
        name: Maxime Collombin
        email: maxime.collombin@netplus.ch

resources:
    flaeche_geo:
        type: collection
        title: Renewable energy planning areas
        description: Renewable-energy planning areas in canton Schaffhausen.
        keywords:
            - richtplanung
            - energy
        extents:
            spatial:
                bbox: [8.5314, 47.6998, 8.8726, 47.7806]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [public]
              id_field: id
              geom_field: geom
              table: flaeche_geo
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG

    waldabstand_geo:
        type: collection
        title: Forest-distance lines
        description: Forest-distance lines in canton Glarus.
        keywords:
            - waldabstandslinien
            - forest
        extents:
            spatial:
                bbox: [9.0544, 47.0937, 9.1785, 47.1164]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [public]
              id_field: id
              geom_field: geom
              table: waldabstand_geo
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=waldabstand_geo(geom)'
              options:
                  type: MS_LAYER_LINE
                  layer: Waldabstand_Graphics
                  style: /styles/waldabstand.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG

    mainroads:
        type: collection
        title: Main roads
        description: Swiss-wide main road segments.
        keywords:
            - mainroads
            - transport
        extents:
            spatial:
                bbox: [6.0501, 45.8688, 10.4873, 47.8020]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [public]
              id_field: id
              geom_field: geometry
              table: roadsegment
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=roadsegment(geometry)'
              options:
                  type: MS_LAYER_LINE
                  layer: Roads_Graphics
                  style: /styles/roads.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG

    buildinglines:
        type: collection
        title: Building restriction lines
        description: Building restriction lines along Swiss motorways.
        keywords:
            - buildinglines
            - motorways
        extents:
            spatial:
                bbox: [7.3723, 46.7772, 9.1867, 47.4499]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [public]
              id_field: id
              geom_field: geom
              table: buildingline_geo
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=buildingline_geo(geom)'
              options:
                  type: MS_LAYER_LINE
                  layer: BuildingLines_Graphics
                  style: /styles/buildinglines.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG

    uebertragungsleitungen:
        type: collection
        title: Electricity transmission planning
        description: Planning corridors and areas for electricity transmission lines.
        keywords:
            - sachplan
            - uebertragungsleitungen
            - energy
        extents:
            spatial:
                bbox: [6.9582, 45.8360, 9.6414, 47.6669]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [public]
              id_field: id
              geom_field: geom
              table: suel_planningmeasure_surface
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=suel_planningmeasure_geo(geom)'
              options:
                  type: MS_LAYER_POLYGON
                  layer: PlanningMeasure_Graphics
                  style: /styles/sachplan_uebertragungsleitungen.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG
