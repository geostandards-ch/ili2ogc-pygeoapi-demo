server:
    bind:
        host: 0.0.0.0
        port: 80
    url: http://localhost:5000
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    languages:
        - en-US
    pretty_print: true
    limits:
        default_items: 20
        max_items: 100

logging:
    level: INFO

metadata:
    identification:
        title: ili2ogc pygeoapi demo
        description: >-
            Live OGC API Features service backed by a PostGIS schema generated from an
            INTERLIS .ili model via ili2ogc (interlis convert-sql), serving real cantonal
            (Schaffhausen) renewable-energy planning data as a 3rd, independent JSON-FG
            serialization (pygeoapi-plugins' formatter) to compare against ili2ogc's own
            convert-jsonfg output for the same VIEW.
        keywords:
            - interlis
            - ogc
            - json-fg
            - richtplanung
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: https://github.com/maxcollombin/ili2ogc
    license:
        name: MIT
        url: https://github.com/maxcollombin/ili2ogc/blob/main/LICENSE
    provider:
        name: Maxime Collombin
        url: https://github.com/maxcollombin/ili2ogc
    contact:
        name: Maxime Collombin
        email: maxime.collombin@netplus.ch

resources:
    flaeche_geo:
        type: collection
        title: RichtplanungErneuerbareEnergien - Flaeche
        description: >-
            Renewable-energy planning areas (Flaeche) of canton Schaffhausen, loaded from
            the real geodienste.ch RichtplanungErneuerbareEnergien_V1 .xtf via ili2ogc's
            convert-sql schema for the derived RichtplanungErneuerbareEnergien_V1_d_01 VIEW.
        keywords:
            - richtplanung
            - energy
        extents:
            spatial:
                bbox: [2590000, 1210000, 2900000, 1400000]
                crs: http://www.opengis.net/def/crs/EPSG/0/2056
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [public]
              id_field: id
              geom_field: geom
              table: flaeche_geo
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG
