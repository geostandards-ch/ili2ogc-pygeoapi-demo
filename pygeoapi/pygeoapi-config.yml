server:
    bind:
        host: 0.0.0.0
        port: 80
    url: http://localhost:5000
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    languages:
        - en-US
        - de-CH
        - fr-CH
    pretty_print: true
    limits:
        default_items: 20
        max_items: 500
    map:
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'

logging:
    level: INFO

metadata:
    identification:
        title: ili2ogc pygeoapi demo
        description: >-
            Swiss official geodata (federal sectoral plans, minimal geodata
            models) converted from INTERLIS with ili2ogc and served via OGC API
            Features and Maps.
        keywords:
            - interlis
            - ogc
            - official geodata
            - switzerland
        terms_of_service: https://opendata.swiss/en/terms-of-use/#terms_by
        url: https://github.com/maxcollombin/ili2ogc
    license:
        name: MIT
        url: https://github.com/maxcollombin/ili2ogc/blob/main/LICENSE
    provider:
        name: GeoStandards.ch
        url: https://www.geostandards.ch
    contact:
        name: GeoStandards.ch
        country: Switzerland
        email: tools@geostandards.ch
        url: https://www.geostandards.ch
        role: pointOfContact

resources:
    richtplanung:
        type: collection
        title:
            de: "Richtplanung erneuerbare Energien"
            fr: "Plan directeur énergies renouvelables"
        description:
            de: >-
                Das Energiegesetz des Bundes sieht vor, die Nutzung aller erneuerbarer
                Energien in der Schweiz auszubauen. Die Kantone sind verpflichtet,
                insbesondere Gebiete zur Nutzung von Wasser- und Windkraft in ihren
                Richtplänen zu bezeichnen (Art. 10 des Energiegesetzes, Art. 8b des
                Raumplanungsgesetzes). Die Daten basieren auf dem Modell "Übersicht
                kantonale Richtplanung betreffend erneuerbare Energien".
            fr: >-
                La loi fédérale sur l’énergie prévoit le développement de l’utilisation
                de toutes les énergies renouvelables en Suisse. Les cantons sont
                notamment tenus de désigner des zones d’utilisation de l’énergie
                hydraulique et éolienne dans leurs plans directeurs (art. 10 de la loi
                sur l’énergie, art. 8b de la loi sur l’aménagement du territoire). Les
                données se fondent sur le modèle de "Aperçu des plans directeurs
                cantonaux en lien avec les énergies renouvelables".
        keywords:
            en:
                - "biomass energy"
                - "solar energy"
                - "wind power"
                - "energy"
                - "water power"
                - "biomass"
                - "energy type"
                - "minimum geodata model MGDM"
                - "canton"
                - "Switzerland"
            de:
                - "Energie aus Biomasse"
                - "Solarenergie"
                - "Windenergie"
                - "Energie"
                - "Wasserkraft"
                - "Biomasse"
                - "Energieart"
                - "Minimales Geodatenmodel MGDM"
                - "Kanton"
                - "Schweiz"
            fr:
                - "energie de la biomasse"
                - "énergie solaire"
                - "énergie éolienne"
                - "énergie"
                - "énergie hydraulique"
                - "biomasse"
                - "type d'énergie"
                - "modèle de géodonnées minimal MGDM"
                - "canton"
                - "Suisse"
        links:
            - type: text/html
              rel: describedby
              title: geocat.ch metadata record
              href: https://www.geocat.ch/geonetwork/srv/eng/catalog.search#/metadata/f5c2c313-00bb-43d6-a3a8-7ccb5a099a96
              hreflang: en-US
        extents:
            spatial:
                bbox: [8.5314, 47.6998, 8.8726, 47.7806]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [richtplanung, public]
              id_field: t_id
              geom_field: geometrie
              table: flaeche_features
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=richtplanung.flaeche_graphics(geometrie)'
              options:
                  type: MS_LAYER_POLYGON
                  layer: Flaeche_Graphics
                  style: /styles/flaeche.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG

    waldabstandslinien:
        type: collection
        title:
            de: "Waldabstandslinien"
            fr: "Distances par rapport à la forêt"
        description:
            de: >-
                Bauten und Anlagen in Waldesnähe sind nur zulässig, wenn sie die
                Erhaltung, Pflege und Nutzung des Waldes nicht beeinträchtigen. Die
                Kantone legen aufgrund rechtskräftiger Waldabstandslinien einen
                angemessenen Mindestabstand fest, der zwischen den Bauten und Anlagen
                und dem Waldrand einzuhalten ist. Dieser Abstand wird unter
                Berücksichtigung der Lage und der voraussichtlichen Höhe der Bestockung
                ermittelt. Die Daten basieren auf dem MGDM Waldabstandslinien (ID 159.1,
                Version 1.2).
            fr: >-
                Les constructions et les installations proches de la forêt ne sont
                permises que si elles ne portent atteinte ni à sa conservation, ni à son
                entretien, ni à son exploitation. Les cantons définissent une distance
                minimale appropriée (fondée sur des distances par rapport à la forêt
                déjà en vigueur), à respecter pour l’écart séparant les constructions et
                les installations de la lisière de la forêt. Cette distance est
                déterminée en tenant compte de la position du peuplement et de sa
                hauteur prévisionnelle. Les données se fondent sur le MGDM distances par
                rapport à la forêt (ID 159.1, version 1.2).
        keywords:
            en:
                - "wood"
                - "federal law"
                - "forest clearance"
                - "land use planning"
                - "canton"
                - "minimum geodata model MGDM"
                - "official geodata"
                - "Switzerland"
            de:
                - "Wald"
                - "Bundesrecht"
                - "Waldabstand"
                - "Nutzungsplanung"
                - "Kanton"
                - "Minimales Geodatenmodel MGDM"
                - "Geobasisdaten"
                - "Schweiz"
            fr:
                - "bois"
                - "loi fédérale (D)"
                - "déboisement"
                - "planification de l'utilisation du sol"
                - "canton"
                - "modèle de géodonnées minimal MGDM"
                - "géodonnées de base"
                - "Suisse"
        links:
            - type: text/html
              rel: describedby
              title: geocat.ch metadata record
              href: https://www.geocat.ch/geonetwork/srv/eng/catalog.search#/metadata/a81f0dc0-a795-4035-822c-4c3bf36e0916
              hreflang: en-US
        extents:
            spatial:
                bbox: [9.0544, 47.0937, 9.1785, 47.1164]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [waldabstandslinien, public]
              id_field: t_id
              geom_field: geometrie
              table: waldabstand_linie_features
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=waldabstandslinien.waldabstand_graphics(geometrie)'
              options:
                  type: MS_LAYER_LINE
                  layer: Waldabstand_Graphics
                  style: /styles/waldabstand.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
