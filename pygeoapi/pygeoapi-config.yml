    mainroads:
        type: collection
        title:
            en: "Main roads network"
            de: "Hauptstrassennetz der Schweiz (MinVV)"
            fr: "Réseau des routes principales suisses (OUMin)"
        description:
            de: >-
                Dieser Datensatz umfasst das Netz der schweizerischen Hauptstrassen, das
                in der Verordnung über die Verwendung der zweckgebundenen
                Mineralölsteuer im Strassenverkehr (MinVV) festgelegt ist. Der Bund, der
                den Kantonen Beiträge für das Hauptstrassennetz gewährt, definiert
                eindeutig, welche Infrastruktur zum Hauptstrassennetz gehört. Die Achsen
                der Hauptstrassen können für die Beschreibung und die Referenzierung von
                Sachverhalten entlang der Strassen verwendet werden. Im Gegensatz zum
                schweizerischen Hauptstrassennetz gem. MinVV wird das Hauptstrassennetz
                gemäss Durchgangsstrassenverordnung auf nationaler Ebene nicht
                kartografisch dargestellt. Die Durchgangsstrassenverordnung hält
                lediglich die Strassenverbindungen fest, die dem Durchgangsverkehr
                offenstehen müssen. Welcher Streckenverlauf resp. welche
                Strasseninfrastruktur genau betroffen ist, wird hingegen nicht
                angegeben.
            fr: >-
                Ce jeu de données comprend le réseau des routes principales suisses
                défini dans l’Ordonnance concernant l'utilisation de l'impôt sur les
                huiles minérales à affectation obligatoire dans le trafic routier
                (OUMin). La Confédération, qui alloue des contributions financières aux
                cantons pour le réseau de routes principales suisses, définit de façon
                univoque quelle infrastructure fait partie du réseau des routes
                principales suisses. Les axes des routes principales peuvent être
                utilisés pour la description et le référencement de faits matériels le
                long des routes. A la différence du réseau de routes principales défini
                par l’OUMin, le réseau des routes principales défini par l’Ordonnance
                concernant les routes de grand transit ne fait quant à lui pas l'objet
                d'une cartographie au niveau national. L’Ordonnance concernant les
                routes de grand transit définit les itinéraires routiers qui doivent
                être ouverts au grand transit, sans préciser exactement quel tracé,
                respectivement quelle infrastructure routière est directement concernée.
        keywords:
            en:
                - "main road"
                - "geodata"
                - "axis"
                - "official geodata"
                - "Switzerland"
            de:
                - "Hauptstrasse"
                - "Geodaten"
                - "Achse"
                - "Geobasisdaten"
                - "Schweiz"
            fr:
                - "route principale"
                - "géodonnées"
                - "axe"
                - "géodonnées de base"
                - "Suisse"
        links:
            - type: text/html
              rel: describedby
              title: geocat.ch metadata record
              href: https://www.geocat.ch/geonetwork/srv/eng/catalog.search#/metadata/c1333de6-fb91-4b0b-be95-8eab89b05358
              hreflang: en-US
        extents:
            spatial:
                bbox: [6.0501, 45.8688, 10.4873, 47.8020]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [mainroads, public]
              id_field: t_id
              geom_field: geometry
              table: roadsegment
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=mainroads.roads_graphics(geometry)'
              options:
                  type: MS_LAYER_LINE
                  layer: Roads_Graphics
                  style: /styles/roads.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG

    buildinglines:
        type: collection
        title:
            en: "Building lines for motorways"
            de: "Baulinien Nationalstrassen"
            fr: "Alignements des routes nationales"
        description:
            en: >-
                The dataset of building lines for motorways contains information about
                the location and authorisation status of building lines along motorways.
                Building lines meet the needs of road safety and living conditions, and
                document the requirements of any future extension to the road.
            de: >-
                Der Datensatz der Baulinien Nationalstrassen enthält die Informationen
                über die Lage und den Genehmigungstand der Baulinien entlang den
                Nationalstrassen. Baulinien tragen den Anforderungen der
                Verkehrssicherheit und der Wohnhygiene Rechnung und dokumentieren die
                Bedürfnisse eines allfälligen künftigen Ausbaus der Strasse.
            fr: >-
                Ce jeu de données contient les informations relatives à la situation et
                au degré d'autorisation des alignements le long des routes nationales.
                Les alignements tiennent compte des exigences de la sécurité du trafic
                et de celles de l'hygiène des habitations, et documentent la nécessité
                d'un élargissement éventuel de la route dans l'avenir.
        keywords:
