    uebertragungsleitungen:
        type: collection
        title:
            en: "Electricity Transmission Lines sectoral plan"
            de: "Sachplan Übertragungsleitungen (SÜL)"
            fr: "Plan sectoriel des lignes de transport d'électricité (PSE)"
        description:
            en: >-
                Sectoral planning is the federal government’s overlying planning and
                coordination tool for implementing its spatial planning duties. Projects
                concerning the construction and expansion of high-voltage power lines at
                the 220/380 kV level which have a significant spatial and environmental
                impact normally have to be specified in the Transmission Lines sectoral
                plan.
            de: >-
                Die Sachplanung ist das übergeordnete Planungs- und
                Koordinationsinstrument des Bundes für die Umsetzung seiner
                raumplanerischen Aufgaben. Bauvorhaben für den Aus- und Neubau von
                Hochspannungsleitungen auf der Spannungsebene 220/380 kV, die sich
                erheblich auf Raum und Umwelt auswirken, müssen in der Regel im Sachplan
                Übertragungsleitungen (SÜL) festgesetzt werden.
            fr: >-
                La planification sectorielle est le principal instrument de
                planification et de coordination de la Confédération dans la mise en
                œuvre de ses tâches relatives à l’aménagement du territoire. Les projets
                d’extension ou de construction de lignes à haute tension (220/380 kV),
                qui ont des effets importants sur le territoire et l’environnement,
                doivent en règle générale figurer dans le plan sectoriel des lignes de
                transport d’électricité (PSE).
        keywords:
            en:
                - "official geodata"
                - "Switzerland"
            de:
                - "Geobasisdaten"
                - "Schweiz"
            fr:
                - "géodonnées de base"
                - "Suisse"
        links:
            - type: text/html
              rel: describedby
              title: geocat.ch metadata record
              href: https://www.geocat.ch/geonetwork/srv/eng/catalog.search#/metadata/e1134feb-55d7-4b44-8e13-125e983b259b
              hreflang: en-US
        extents:
            spatial:
                bbox: [6.9582, 45.8360, 9.6414, 47.6669]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [uebertragungsleitungen, public]
              id_field: t_id
              geom_field: surface
              table: planningmeasure_features
              # Readable columns only; the other geometry columns are left out (one geometry per feature).
              properties: [t_ili_tid, name, measuretype_reference_typeid, measuretype_reference_name, coordinationlevel_reference_coordid, coordinationlevel_reference_name, planningstatus_reference_name, facility_name, facility_transmissionlinesfacility_name, modinfo_validfrom, modinfo_latestmodification]
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=uebertragungsleitungen.planningmeasure_graphics(surface)'
              options:
                  type: MS_LAYER_POLYGON
                  layer: PlanningMeasure_Graphics
                  style: /styles/sachplan_uebertragungsleitungen.sld
                  projection: 2056
              format:
                  name: png
                  mimetype: image/png
        formatters:
            - name: pygeoapi_plugins.formatter.JSONFG

    asyl:
        type: collection
        title:
            en: "Sectoral plan for Asylum (SPA)"
            de: "Sachplan Asyl (SPA)"
            fr: "Plan sectoriel Asile (PSA)"
        description:
            en: >-
                With the SPA, the Swiss State Secretariat for Migration (SEM) has
                ensured a rough plan for and basic coordination of federal government
                asylum centres. The SPA contains an overview of the government asylum
                centres across Switzerland and some basic principles for coordination
                with strategic goals and for cooperation between the relevant
                authorities. A sectoral plan entry forms the basis for planning approval
                for a project with significant repercussions for space and the
                environment.
            de: >-
                Mit dem SPA stellt das Staatssekretariat für Migration die Grobplanung
                und -abstimmung von Bundesasylzentren sicher. Der SPA enthält eine
                schweizweite Übersicht über die Bundesasylzentren sowie Grundsätze zur
                Abstimmung mit strategischen Zielen und zur Zusammenarbeit zwischen den
                betroffenen Behörden. Ein Sachplaneintrag bildet jeweils die Grundlage
                für eine Plangenehmigung eines Projekts mit erheblichen Auswirkungen auf
                Raum und Umwelt.
            fr: >-
                Par l'élaboration du plan sectoriel Asile (PSA), le Secrétariat d'État
                aux migrations assure, dans les grandes lignes, la planification et la
                coordination des centres fédéraux pour requérants d'asile. Le PSA
                contient un aperçu de l'ensemble des centres fédéraux et des principes
                servant à les coordonner avec les objectifs stratégiques et à faciliter
                la collaboration entre les autorités concernées. Chaque inscription au
                plan sectoriel constitue la base d'une approbation des plans d'un projet
                ayant des effets considérables sur le territoire et l'environnement.
        keywords:
            en:
                - "federal authority"
                - "sectoral plan"
                - "official geodata"
                - "Switzerland"
            de:
                - "Bundesbehörde"
                - "Sachplan"
                - "Geobasisdaten"
                - "Schweiz"
            fr:
                - "autorité fédérale"
                - "plan sectoriel"
                - "géodonnées de base"
                - "Suisse"
        links:
            - type: text/html
              rel: describedby
              title: geocat.ch metadata record
              href: https://www.geocat.ch/geonetwork/srv/eng/catalog.search#/metadata/23a9027d-37a1-4ba4-b529-54c658540914
              hreflang: en-US
        extents:
            spatial:
                bbox: [6.1272, 45.8314, 9.5608, 47.6542]
        providers:
            - type: feature
              name: PostgreSQL
              data:
                  host: postgis
                  dbname: postgres
                  user: postgres
                  password: postgres
                  search_path: [asyl, public]
              id_field: t_id
              geom_field: point
              table: facility_lv95_features
              # Readable columns only; the other geometry columns are left out (one geometry per feature).
              properties: [t_ili_tid, name, facilitykind_reference_kindid, facilitykind_reference_name, facilitystatus_reference_name, object_name, symbolori, modinfo_validfrom, modinfo_latestmodification]
              storage_crs: http://www.opengis.net/def/crs/EPSG/0/2056
              crs:
                  - http://www.opengis.net/def/crs/EPSG/0/2056
                  - http://www.opengis.net/def/crs/OGC/1.3/CRS84
            - type: map
              name: MapScript
              data: 'PG:host=postgis dbname=postgres user=postgres password=postgres tables=asyl.facility_graphics(point)'
              options:
