services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build: ./loader
    volumes:
      - ./models:/models:ro
      - ./collections:/collections:ro
      - ./data:/data:ro
      - styles:/styles
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/postgres
    depends_on:
      postgis:
        condition: service_healthy

  pygeoapi:
    build: ./pygeoapi
    ports:
      - "5000:80"
    volumes:
      - styles:/styles:ro
    depends_on:
      postgis:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

volumes:
  styles:
